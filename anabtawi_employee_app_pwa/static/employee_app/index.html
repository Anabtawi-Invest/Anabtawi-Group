<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Employee App</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <style id="anabtawi-mobile-rtl-fix">
      html, body, #root {
        width: 100%;
        max-width: 100%;
        min-height: 100%;
        overflow-x: hidden !important;
        overscroll-behavior-x: none;
        touch-action: pan-y;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      html, body, #root {
        direction: ltr !important;
      }
      body[data-app-language="ar"] {
        text-align: right;
      }
      input[type="email"],
      input[type="url"],
      input[type="tel"],
      input[type="password"] {
        direction: ltr !important;
        text-align: left !important;
      }
      #root > * {
        max-width: 100vw;
        overflow-x: hidden;
      }
      img, svg, canvas, video {
        max-width: 100%;
      }
    </style>

  <link rel="icon" href="/anabtawi_employee_app_pwa/static/employee_app/favicon.ico"/>    <link rel="manifest" href="/employee-portal/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/anabtawi_employee_app_pwa/static/employee_app/icons/favicon.png">
    <link rel="apple-touch-icon" href="/anabtawi_employee_app_pwa/static/employee_app/icons/icon-192.png">
    <meta name="theme-color" content="#090B18">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Employee App">
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/anabtawi_employee_app_pwa/static/employee_app/app.js" defer></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/employee-portal/sw.js", { scope: "/employee-portal" }).catch(function (err) {
      console.warn("Employee App service worker registration failed", err);
    });
  });
}
</script>
</body>
</html>
