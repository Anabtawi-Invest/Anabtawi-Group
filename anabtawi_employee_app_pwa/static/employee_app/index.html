<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Employee App</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <style id="employee-mobile-rtl-stability">
      html, body, #root {
        width: 100%;
        max-width: 100%;
        height: 100%;
        min-height: 100%;
        overflow-x: hidden !important;
        overscroll-behavior-x: none;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        touch-action: pan-y;
      }
      body {
        margin: 0;
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        max-width: 100vw;
        background: #090B18;
      }
      #root {
        overflow: hidden;
        max-width: 100vw;
      }
      #root * {
        box-sizing: border-box;
      }
      #root img, #root svg, #root canvas, #root video {
        max-width: 100%;
      }
      [dir="rtl"],
      [dir="rtl"] body {
        direction: rtl;
        text-align: right;
      }
      [dir="ltr"],
      [dir="ltr"] body {
        direction: ltr;
        text-align: left;
      }
      [dir="rtl"] input[type="email"],
      [dir="rtl"] input[type="url"],
      [dir="rtl"] input[type="tel"],
      [dir="rtl"] input[type="password"],
      [dir="rtl"] input[name*="email" i],
      [dir="rtl"] input[name*="login" i],
      [dir="rtl"] .force-ltr {
        direction: ltr !important;
        text-align: left !important;
        unicode-bidi: plaintext;
      }
      [dir="rtl"] input::placeholder,
      [dir="rtl"] textarea::placeholder {
        text-align: inherit;
      }
      @media (max-width: 768px) {
        html, body, #root {
          max-width: 100vw;
        }
        body {
          overflow-x: hidden !important;
        }
      }
    </style>
  <link rel="icon" href="/anabtawi_employee_app_pwa/static/employee_app/favicon.ico"/>    <link rel="manifest" href="/employee-portal/manifest.webmanifest">
    <link rel="icon" type="image/png" href="/anabtawi_employee_app_pwa/static/employee_app/icons/favicon.png">
    <link rel="apple-touch-icon" href="/anabtawi_employee_app_pwa/static/employee_app/icons/icon-192.png">
    <meta name="theme-color" content="#090B18">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Employee App">
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  <script src="/anabtawi_employee_app_pwa/static/employee_app/app.js" defer></script>

<script id="employee-mobile-rtl-stability-runtime">
(function () {
  function getLang() {
    try {
      return localStorage.getItem('employee_app_language') || localStorage.getItem('language') || localStorage.getItem('locale') || document.documentElement.lang || 'en';
    } catch (e) {
      return document.documentElement.lang || 'en';
    }
  }
  function applyDir() {
    var lang = (getLang() || 'en').toLowerCase();
    var isArabic = lang.indexOf('ar') === 0;
    document.documentElement.lang = isArabic ? 'ar' : 'en';
    document.documentElement.dir = isArabic ? 'rtl' : 'ltr';
    if (document.body) {
      document.body.dir = isArabic ? 'rtl' : 'ltr';
    }
  }
  applyDir();
  window.addEventListener('storage', applyDir);
  window.addEventListener('orientationchange', function () { setTimeout(applyDir, 250); });
  window.EmployeeAppApplyDirection = applyDir;
})();
</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("/employee-portal/sw.js", { scope: "/employee-portal" }).catch(function (err) {
      console.warn("Employee App service worker registration failed", err);
    });
  });
}
</script>
</body>
</html>
